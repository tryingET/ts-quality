# ts-quality in System4D terms.
# A softwareco product repo: an offline-first, deterministic TypeScript/JavaScript change-quality platform (npm package ts-quality, alpha) built as one monorepo of packages/*.
# Written for the agents that work in and beside this repo: read it before changing what the repo does or how.
# README.md, AGENTS.md and docs/project/ hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "ts-quality"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Evidence: crap4ts maps LCOV coverage to functions and computes CRAP scores for the changed scope (packages/crap4ts)"
          - "Behavioral pressure: ts-mutate runs deterministic mutation tests in isolated workspaces once the baseline test command passes (packages/ts-mutate)"
          - "Invariant alignment: invariants bind behavior to paths and symbols, emit missing-test obligations and grade scenario support from lexical to execution-witnessed (packages/invariants)"
          - "Judgment and governance: an explainable merge-confidence verdict (packages/policy-engine) and constitutions for boundaries, approvals, rollback evidence, ownership and risk budgets (packages/governance)"
          - "Legitimacy: agents, grants, Ed25519 attestations, overrides and amendments evaluated against the exact run (packages/legitimacy)"
          - "The unified ts-quality CLI and run-bound artifacts under .ts-quality/runs/<run-id>/ (packages/ts-quality, packages/evidence-model)"
          - "Durable cross-repo adoption and quality-proof records that cite source-owner evidence without absorbing its authority (docs/adoption/, docs/project/vision.md)"
        out_of_scope:
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it (AGENTS.md, ADR 2026-04-19 projection authority contract); docs and governance/task-scopes/ snapshots are projections"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
          - "Task tracking, an organization control plane, a general workflow engine or a release system by itself (docs/project/vision.md)"
          - "Dependency intelligence, runtime traces, visualization, exploitability and remediation: their owner repos keep that authority (docs/project/vision.md)"
          - "Natural-language semantic proof, opaque learned scoring, or replacing tests or human judgment (docs/project/vision.md)"
      constraints:
        - "Node.js >= 22; the product depends on the classic TypeScript compiler API on the TypeScript 5 line; TypeScript 7 is deferred (docs/engineering.local.md)"
        - "Offline-first: every core flow works locally with no network dependency (ARCHITECTURE.md)"
        - "Config and repo-local support modules are data-only and never executed (ADR 2026-03-19 data-only config modules)"
        - "Alpha: before 1.0 breaking changes are allowed when they improve evidence, safety or trust boundaries; record them in docs/decisions/, README.md and CHANGELOG.md (ADR 2026-03-19)"
        - "Manifests name 0.7.0, prepared locally; the operator authorized preparation only, no tag, push or publication; the last recorded public release is 0.6.0 (README.md)"
        - "When runtime behavior changes, rebuild dist/ and keep examples/artifacts/ intentional (AGENTS.md)"
      edges:
        - name: "Target repo inputs"
          direction: "in"
          protocol: "file"
          system: "The target repo being checked: ts-quality.config.ts, LCOV, explicit changed scope (--changed, changeSet.files or a diff), test and witness commands, constitution, agents, approvals, attestations"
          contract: "docs/config-reference.md; docs/invariant-dsl.md; docs/attestation-format.md"
        - name: "Run artifacts"
          direction: "out"
          protocol: "file"
          system: "Operators, CI, agents and downstream tools reading .ts-quality/runs/<run-id>/ (run.json, report.json) and .ts-quality/latest.json"
          contract: "docs/public-contract.md; docs/ci-integration.md"
        - name: "npm package"
          direction: "out"
          protocol: "https"
          system: "npm registry (ts-quality), through scripts/release-orchestrator.mjs and .github/workflows/publish.yml, only by owner authorization"
          contract: "docs/npm-publishing-checklist.md; docs/releases/"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this repo live in AK, not in markdown; npm run handoff:sync checks and exports AK direction read-only"
        - name: "core/ontology-kernel and softwareco/ontology"
          type: "build"
          note: "The core and company ontology layers, pinned in ontology/manifest.yaml"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which pins the release it accepts (0.4.4)"
        - name: "engineering-core"
          type: "build"
          note: "The ts engineering lane at v0.12.2: policy/engineering-lane.json points at it, docs/engineering.local.md holds the local overrides"
        - name: "typescript ^5.8.3"
          type: "runtime"
          note: "The only runtime dependency of the ts-quality package: AST parsing and transpiling for CRAP, mutation, invariants and governance"
      anti_goals:
        - "Broadening evidence search, or upgrading lexical alignment into proof, to make outputs greener (AGENTS.md)"
        - "Marketing semantic depth beyond what deterministic evidence supports (AGENTS.md)"
        - "Importing external workflow doctrine as core semantics unless the repo adopts it natively (AGENTS.md: architecture-boundary axiom)"
        - "Literal complete parity with infra/ts-quality-tools: the proposal is native supersession of useful capabilities with accepted discontinuations (docs/project/legacy-supersession-wave.md)"
    compass:
      drivers:
        - "AI-heavy repos fail in boring ways: tests pass but barely constrain behavior, mutation pressure is missing, boundaries are bypassed through aliases, approvals drift from the reviewed run, and confidence has no evidence trail (README.md)"
      outcomes:
        - "A reviewer, CI system or agent can ask why a change is trusted, blocked, waived, amended or authorized and get an answer grounded in deterministic artifacts (docs/project/vision.md)"
        - "A concise summary and the machine artifacts tell the same story at different depths, and the output names the next evidence obligation (docs/project/vision.md)"
      tradeoffs:
        - decision: "Executable versus data-only config"
          chosen: "Data-only config and support modules"
          because: "Trust-boundary hardening and deterministic loading (docs/decisions/2026-03-19-data-only-config-modules.md)"
        - decision: "Run identity on retry"
          chosen: "Every check reserves an unused run id; failed or interrupted reservations need a new id"
          because: "An occupied id must never rebind approvals to replacement evidence (docs/decisions/2026-10-03-immutable-run-identity-and-complete-scope-drift.md)"
        - decision: "What earns invariant support"
          chosen: "Lexical matches stay lexically-supported; supported needs content-bound execution witnesses"
          because: "Stale or unbound witnesses must not grant support (docs/decisions/2026-10-03-content-bound-execution-witnesses.md)"
        - decision: "Checked-in verification records"
          chosen: "VERIFICATION.md and verification/verification.log stay checked-in generated reference artifacts"
          because: "Repo verification stays reviewable without confusing it with live CI status (docs/decisions/2026-04-19-verification-artifact-contract.md)"
    engine:
      triggers:
        - "An operator, agent or CI runs npx ts-quality check, then explain, report, plan, govern, authorize, attest, amend, witness or trend"
        - "A maintainer runs npm run verify, the root validation contract, or the release orchestrator"
      states:
        - name: "reserved"
          meaning: "The run id is taken before commands execute; it is never reused, even after a failure"
        - name: "persisted"
          meaning: "run.json holds the immutable check-time evidence and control-plane snapshot"
        - name: "projected"
          meaning: "explain/report/govern/authorize read the run with decisionContext; drift in changed files or control-plane inputs fails authorization closed"
        - name: "lexically-supported / supported"
          meaning: "Invariant scenario support from lexical alignment only, or from content-bound execution witnesses"
      invariants:
        - id: "TSQ-INV-001"
          statement: "Identical inputs produce identical artifacts and verdicts; JSON is key-sorted"
          enforcement: "test: test/golden-output.test.mjs; scripts/verify.mjs regenerates sample artifacts twice and fails on any difference"
        - id: "TSQ-INV-002"
          statement: "check fails closed when no explicit changed scope is given, never widening to the whole repo"
          enforcement: "test: test/cli-integration.test.mjs"
        - id: "TSQ-INV-003"
          statement: "A check refuses an occupied or reserved run id, run.json is created exclusively, and every declared changed path carries a digest whose drift (or absence) blocks authorization"
          enforcement: "test: test/run-trust-boundaries.test.mjs"
        - id: "TSQ-INV-004"
          statement: "Stale, unbound or contradicted witnesses grant no execution support; a current scoped failure vetoes matching passes"
          enforcement: "test: test/witness-freshness.test.mjs, test/invariants.test.mjs"
        - id: "TSQ-INV-005"
          statement: "Governance fails closed on a non-literal dynamic import or require in a boundary-scoped file"
          enforcement: "test: test/governance.test.mjs"
        - id: "TSQ-INV-006"
          statement: "Config modules load as data only"
          enforcement: "test: test/config-loading.test.mjs"
      lifecycle:
        - "init and materialize the data-only config"
        - "check with explicit changed scope and a new run id: CRAP, mutation once the baseline test command passes, configured witnesses, invariants, verdict, governance"
        - "Persist the run under .ts-quality/runs/<run-id>/ with the snapped control plane"
        - "explain, report, govern and authorize against --run-id; drift fails closed"
        - "CI asserts on the artifacts, not on exit codes (docs/ci-integration.md)"
    fog:
      assumptions:
        - id: "TSQ-A-001"
          statement: "Scratch and real-shape pilots predict normal-checkout use in target repos; no owner-accepted normal-checkout adoption exists yet"
          how_to_validate: "The Horizon 2 flow in docs/project/product-posture.md: doctor, focused witness, check, report/explain, governance/authorization and retention in a fresh target checkout, with owner acceptance"
        - id: "TSQ-A-002"
          statement: "A witness's declared scope (source/test bytes, package/lock/tsconfig, command, environment, runtime) covers what it depends on; ts-quality does not discover dependencies exhaustively"
          how_to_validate: "Compare the declared witness scope with what the witness command exercises (ARCHITECTURE.md data flow step 6)"
      risks:
        - id: "TSQ-R-001"
          statement: "check, govern and authorize can exit zero while their decision blocks the change, so a CI that trusts exit codes approves blocked changes"
          mitigation: "Use the artifact assertions in docs/ci-integration.md; test/ci-decision-recipe.test.mjs"
        - id: "TSQ-R-002"
          statement: "Safety fixes in current source (run-id reservation, complete changed-path digests, content-bound witnesses, workspace-baseline correction) are not in the recorded public 0.6.0 package"
          mitigation: "Never claim them as public; publish only through owner-authorized release; regenerate legacy witnesses per docs/releases/migrations/content-bound-witnesses.md"
        - id: "TSQ-R-003"
          statement: "Shallow tests produce shallow evidence that reads as confidence"
          mitigation: "lexically-supported labels, named sub-signals and the status-language rules in docs/project/product-posture.md"
      exceptions:
        - id: "TSQ-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "TSQ-D-001"
          statement: "docs/project/product-posture.md still says manifests name 0.6.0 and witness freshness is unresolved; current source has content-bound witnesses and a locally prepared 0.7.0 (docs/project/legacy-supersession-wave.md)"
          payoff_plan: "Update at the next posture assessment; until then README.md, ARCHITECTURE.md and source win"
        - id: "TSQ-D-002"
          statement: "AK direction check reports nine execution-state mismatches; AK decision 171 cannot be authorized (AK_DECISION_RECORDS_NEED_SCHEMA_47 against live schema 46)"
          payoff_plan: "The AK owner resolves the authorization substrate; do not bypass it (docs/project/2026-10-03-native-direction-disposition.md)"
        - id: "TSQ-D-003"
          statement: "Complete parity with infra/ts-quality-tools is false today; the supersession wave (AK6584) is a proposal with no runtime execution, owner acceptance or retirement"
          payoff_plan: "Execute the wave in docs/project/legacy-supersession-wave.md after owner acceptance"
        - id: "TSQ-D-004"
          statement: "Trust modules and tests are oversized"
          payoff_plan: "Refactor behind behavior-preserving verification and public artifact/API checks (docs/project/product-posture.md, Horizon 3)"
